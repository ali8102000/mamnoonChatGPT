name: Refresh Expo Yarn lockfile

on:
  push:
    branches:
      - main
    paths:
      - "expo-app/package.json"
      - "expo-app/yarn.lock"
      - "expo-app/bun.lock"
      - ".github/workflows/refresh-expo-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Expo Yarn lockfile
        working-directory: expo-app
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --ignore-scripts --non-interactive

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- expo-app/yarn.lock; then
            echo "Expo Yarn lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expo-app/yarn.lock
          git commit -m "chore(expo): add Yarn lockfile"
          git push origin main
