name: Refresh Expo npm lockfile

on:
  push:
    branches:
      - main
    paths:
      - "expo-app/package.json"
      - "expo-app/package-lock.json"
      - "expo-app/bun.lock"
      - ".github/workflows/refresh-expo-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Expo npm lockfile
        working-directory: expo-app
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- expo-app/package-lock.json; then
            echo "Expo npm lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expo-app/package-lock.json
          git commit -m "chore(expo): add npm lockfile"
          git push origin main
