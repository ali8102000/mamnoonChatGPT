name: Mamnoon Android standalone preview APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mamnoon-android-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-preview-apk:
    name: Build standalone Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: expo-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js 26
        uses: actions/setup-node@v5
        with:
          node-version: "26"
      - name: Set up Java for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked app dependencies
        run: bun install
      - name: Generate standalone Android release APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_ENV: production
          EAS_PROJECT_ID: a6c763c4-3a5c-4725-b370-81967e3c0aab
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub repository secret EXPO_TOKEN is required to load the production Expo environment."
            exit 1
          fi
          bunx eas-cli@latest env:exec production 'node scripts/validate-production-env.mjs && bunx expo prebuild --platform android --no-install && cd android && ./gradlew assembleRelease'
          test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Ensure Android build tools are available
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            yes | sdkmanager "build-tools;35.0.0"
          fi
      - name: Verify APK signature, manifest, and alignment
        id: verify-apk
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          printf '%s\\n' "$BADGING"
          grep -Eq "^package: name='com\\.mamnoon\\.app'([ ,]|$)" <<< "$BADGING"
          grep -Fq "sdkVersion:'24'" <<< "$BADGING"
          grep -Fq "targetSdkVersion:'35'" <<< "$BADGING"
          grep -Eq "^application-label(:[a-z]{2,3})?:'.+'" <<< "$BADGING"
          grep -Fq "ممنون" <<< "$BADGING"
      - name: Upload standalone preview APK
        if: always() && steps.verify-apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mamnoon-android-standalone-preview-apk
          path: expo-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Install, launch, and inspect startup on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r expo-app/android/app/build/outputs/apk/release/app-release.apk
            adb shell monkey -p com.mamnoon.app 1
            sleep 30
            adb shell pidof com.mamnoon.app >/dev/null || (adb logcat -d -t 1000; echo "Mamnoon process exited during startup."; exit 1)
            adb logcat -d -t 3000 > /tmp/mamnoon-startup-log.txt
            ! grep -E -i "app-boundary.*Unhandled render error|Unhandled render error.*app-boundary" /tmp/mamnoon-startup-log.txt || (echo "Mamnoon displayed its root React error boundary during startup."; exit 1)
            echo "App process remained alive and no root React error-boundary event was logged."
