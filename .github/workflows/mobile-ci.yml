name: Mamnoon mobile CI

# Run native Android validation for every repository change, not only expo-app edits.
# This keeps web/native behavior changes coupled and prevents one platform from
# silently missing a regression introduced by shared backend or database work.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mamnoon-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo:
    name: Expo typecheck, doctor and Android export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Validate production configuration guards
        env:
          APP_ENV: production
          EAS_BUILD: "true"
          MAMNOON_CI_CONFIG_ONLY: "true"
          EAS_PROJECT_ID: "00000000-0000-4000-8000-000000000000"
          EXPO_PUBLIC_SUPABASE_URL: "https://enteiolvirenbhkyskgb.supabase.co"
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_placeholder"
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: "ci-placeholder"
        run: |
          node scripts/validate-production-env.mjs
          bunx expo config --type public
          env -u EAS_PROJECT_ID EAS_BUILD_PROJECT_ID="00000000-0000-4000-8000-000000000000" bunx expo config --type public
      - name: Expo dependency compatibility
        run: bunx expo install --check
      - name: Export Android bundle
        run: bunx expo export --platform android
