name: Refresh Iraq OSM place search index

on:
  workflow_dispatch:
  schedule:
    - cron: "25 2 * * 1"

permissions:
  contents: read

concurrency:
  group: iraq-osm-place-import
  cancel-in-progress: false

jobs:
  import-iraq-places:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OSM PBF parser
        run: python -m pip install --upgrade pip osmium
      - name: Import named places from the latest Iraq extract
        env:
          SUPABASE_URL: https://enteiolvirenbhkyskgb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PBF_URL: https://geo2day.com/asia/iraq.pbf
          OSM_ALLOW_UPDATES: "false"
        run: python .github/scripts/import-iraq-osm-places.py
