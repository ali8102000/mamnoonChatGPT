name: Auth profile trigger migration integration test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: Validate auth profile trigger migration on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mamnoon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mamnoon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create minimal Auth and profile schema
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mamnoon_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon;
          CREATE ROLE authenticated;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            email text,
            phone text,
            raw_user_meta_data jsonb
          );
          CREATE TABLE public.profiles (
            id uuid PRIMARY KEY,
            phone text NOT NULL UNIQUE,
            full_name text NOT NULL,
            email text
          );
          CREATE TABLE public.user_roles (
            user_id uuid NOT NULL,
            role text NOT NULL,
            UNIQUE (user_id, role)
          );
          SQL
      - name: Apply auth profile trigger migration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mamnoon_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261117210000_auth_profile_trigger_fail_closed.sql
      - name: Test phone normalization, duplicates, optional email and fallback accounts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mamnoon_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/auth_profile_trigger_migration.sql
