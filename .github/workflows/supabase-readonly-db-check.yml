name: Supabase read-only database connection check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-readonly-db-check
  cancel-in-progress: false

jobs:
  verify-credentials-and-schema-dump:
    name: Verify Supabase credentials (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check required secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [[ -z "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "::error::Missing GitHub Actions secret: SUPABASE_DB_PASSWORD"
            exit 1
          fi
          echo "Both required secrets are present."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Supabase CLI version
        shell: bash
        run: npx --yes supabase@latest --version

      - name: Link project and validate database password
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest link --project-ref enteiolvirenbhkyskgb

      - name: Run schema-only database connectivity check
        shell: bash
        run: |
          set -euo pipefail
          dump_file="$RUNNER_TEMP/mamnoon-schema-check.sql"
          cleanup() { rm -f "$dump_file"; }
          trap cleanup EXIT
          npx --yes supabase@latest db dump --remote --file "$dump_file"
          test -s "$dump_file"
          if grep -Eiq '^[[:space:]]*(INSERT[[:space:]]+INTO|COPY[[:space:]])' "$dump_file"; then
            echo "::error::Unexpected data statements found in schema-only dump."
            exit 1
          fi
          echo "Read-only schema dump succeeded; no data statements detected. Temporary dump will be deleted."
