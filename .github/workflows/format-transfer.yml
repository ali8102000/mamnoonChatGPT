name: Format Mamnoon transfer branch

on:
  push:
    branches:
      - merge-old-hardening-2026-11-09

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/merge-old-hardening-2026-11-09'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: merge-old-hardening-2026-11-09
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format TypeScript, UI, docs and workflow files
        run: >
          bunx prettier --write
          "src/**/*.{ts,tsx,js,jsx,json,md,css}"
          "expo-app/**/*.{ts,tsx,js,jsx,json,md,css}"
          "supabase/functions/**/*.ts"
          ".github/workflows/*.{yml,yaml}"
          "docs/**/*.md"
          "package.json"
          "tsconfig.json"
          "vite.config.ts"
      - name: Commit formatting changes when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style: format transferred Mamnoon files"
          git push origin HEAD:merge-old-hardening-2026-11-09
