name: Mamnoon Android test APK

on:
  push:
    branches: [main]
    paths:
      - "expo-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mamnoon-android-test-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build installable Mamnoon debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app
    env:
      APP_ENV: production
      EAS_PROJECT_ID: a6c763c4-3a5c-4725-b370-81967e3c0aab
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Expo dependency compatibility
        run: bunx expo install --check
      - name: Check EAS environment access
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret EXPO_TOKEN."
            exit 1
          fi
          APP_PROJECT_ID="$(node -e 'const c=require("./app.json"); process.stdout.write(c.expo.extra.eas.projectId)')"
          if [ "$APP_PROJECT_ID" != "$EAS_PROJECT_ID" ]; then
            echo "::error::EAS project ID does not match expo-app/app.json."
            exit 1
          fi
      - name: Prebuild and compile installable debug APK without EAS build credits
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          bunx eas-cli@latest env:exec production 'node scripts/validate-production-env.mjs && bunx expo prebuild --platform android --no-install && cd android && chmod +x gradlew && ./gradlew assembleDebug'
      - name: Validate APK
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/mamnoon-test.apk
          test -s release-artifacts/mamnoon-test.apk
          node -e 'const fs=require("fs"); const p="release-artifacts/mamnoon-test.apk"; const b=Buffer.alloc(4); const fd=fs.openSync(p,"r"); fs.readSync(fd,b,0,4,0); fs.closeSync(fd); if(b.toString("hex")!=="504b0304") { console.error("Downloaded file is not a valid APK archive"); process.exit(1); }'
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: mamnoon-test-apk
          path: expo-app/release-artifacts/mamnoon-test.apk
          if-no-files-found: error
          retention-days: 14
