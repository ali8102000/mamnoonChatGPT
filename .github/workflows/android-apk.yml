name: Mamnoon Android test APK

on:
  push:
    branches: [main, feat/android-parity-rebased]
    paths:
      - "expo-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mamnoon-android-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    name: Build standalone Mamnoon release APK
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: expo-app
    env:
      APP_ENV: production
      EAS_PROJECT_ID: a6c763c4-3a5c-4725-b370-81967e3c0aab
      ANDROID_NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools were not found on the runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          for attempt in 1 2 3; do
            rm -rf "$SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
            if "$SDKMANAGER" --install "ndk;$ANDROID_NDK_VERSION" &&
               test -s "$SDK_ROOT/ndk/$ANDROID_NDK_VERSION/source.properties" &&
               grep -q "Pkg.Revision = $ANDROID_NDK_VERSION" "$SDK_ROOT/ndk/$ANDROID_NDK_VERSION/source.properties"; then
              echo "Verified Android NDK $ANDROID_NDK_VERSION"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not install a valid Android NDK after 3 attempts."
              exit 1
            fi
            echo "NDK installation attempt $attempt failed; retrying after cleanup."
            sleep 10
          done
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies with the EAS Yarn lockfile
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Expo dependency compatibility
        run: bunx expo install --check
      - name: Check EAS environment access
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret EXPO_TOKEN."
            exit 1
          fi
          APP_PROJECT_ID="$(node -e 'const c=require("./app.json"); process.stdout.write(c.expo.extra.eas.projectId)')"
          if [ "$APP_PROJECT_ID" != "$EAS_PROJECT_ID" ]; then
            echo "::error::EAS project ID does not match expo-app/app.json."
            exit 1
          fi
      - name: Build standalone APK locally with the production upload key
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          bunx eas-cli@latest env:exec production 'node scripts/validate-production-env.mjs && bunx eas-cli@latest build --platform android --profile preview --local --non-interactive --output release-artifacts/mamnoon-test.apk'
      - name: Validate signed APK
        run: |
          set -euo pipefail
          APK="release-artifacts/mamnoon-test.apk"
          test -s "$APK"
          unzip -t "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > release-artifacts/apk-signing-certificate.txt
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee release-artifacts/apk-metadata.txt
          grep -q "package: name='com.mamnoon.app'" release-artifacts/apk-metadata.txt
          sha256sum "$APK" > release-artifacts/mamnoon-test.apk.sha256
          du -h "$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: mamnoon-test-apk
          path: |
            expo-app/release-artifacts/mamnoon-test.apk
            expo-app/release-artifacts/mamnoon-test.apk.sha256
            expo-app/release-artifacts/apk-metadata.txt
            expo-app/release-artifacts/apk-signing-certificate.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data
          cores: 2
          ram-size: 3072
          heap-size: 512
          disable-animations: true
          script: |
            set -euo pipefail
            test -s expo-app/release-artifacts/mamnoon-test.apk
            adb install -r expo-app/release-artifacts/mamnoon-test.apk
            adb logcat -c
            adb shell monkey -p com.mamnoon.app 1

            # Give Android time to start the React Native application.
            # Keep this smoke script POSIX-simple: the emulator action runs it
            # through its own shell wrapper, so avoid multiline shell loops.
            sleep 45
            adb logcat -d -t 6000 > expo-app/release-artifacts/emulator-logcat.txt
            if grep -q "FATAL EXCEPTION" expo-app/release-artifacts/emulator-logcat.txt; then
              echo "::error::Mamnoon raised a fatal Android exception during launch."
              tail -n 160 expo-app/release-artifacts/emulator-logcat.txt
              exit 1
            fi
            if ! grep -Fq 'ReactNativeJS: Running "main"' expo-app/release-artifacts/emulator-logcat.txt; then
              echo "::error::Mamnoon did not reach the React Native main entry point."
              tail -n 160 expo-app/release-artifacts/emulator-logcat.txt
              exit 1
            fi
            sleep 5
            adb logcat -d -t 6000 > expo-app/release-artifacts/emulator-logcat.txt
            if grep -q "FATAL EXCEPTION" expo-app/release-artifacts/emulator-logcat.txt; then
              echo "::error::Mamnoon crashed after the React Native entry point started."
              tail -n 160 expo-app/release-artifacts/emulator-logcat.txt
              exit 1
            fi
            adb shell screencap -p /sdcard/mamnoon-screen.png
            adb pull /sdcard/mamnoon-screen.png expo-app/release-artifacts/emulator-screen.png
      - name: Upload Android emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mamnoon-emulator-smoke
          path: |
            expo-app/release-artifacts/emulator-logcat.txt
            expo-app/release-artifacts/emulator-screen.png
          if-no-files-found: warn
          retention-days: 7
