# Build a signed Mamnoon Android App Bundle locally using the existing remote EAS upload key.
name: Mamnoon Android production AAB

on:
  push:
    branches: [main]
    paths:
      - "expo-app/**"
      - "eas.json"
      - ".github/workflows/android-aab.yml"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mamnoon-android-aab
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build signed Mamnoon Android App Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app
    env:
      APP_ENV: production
      EAS_PROJECT_ID: a6c763c4-3a5c-4725-b370-81967e3c0aab
      ANDROID_NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools were not found on the runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          "$SDKMANAGER" --install "ndk;$ANDROID_NDK_VERSION"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies with the EAS Yarn lockfile
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Expo dependency compatibility
        run: bunx expo install --check
      - name: Export Android JavaScript bundle
        run: bunx expo export --platform android
      - name: Check EXPO_TOKEN secret
        env:
          EXPO_TOKEN: \${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret EXPO_TOKEN."
            exit 1
          fi
      - name: Validate linked EAS project ID
        run: |
          if ! printf '%s' "$EAS_PROJECT_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'; then
            echo "::error::EAS_PROJECT_ID must be a valid Expo project UUID."
            exit 1
          fi
          APP_PROJECT_ID="$(node -e 'const c=require("./app.json"); process.stdout.write(c.expo.extra.eas.projectId)')"
          if [ "$APP_PROJECT_ID" != "$EAS_PROJECT_ID" ]; then
            echo "::error::EAS_PROJECT_ID does not match expo-app/app.json extra.eas.projectId."
            exit 1
          fi
      - name: Build signed production AAB locally with the existing remote key
        env:
          EXPO_TOKEN: \${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: \${{ github.workspace }}/release-artifacts
        run: |
          set -euo pipefail
          mkdir -p ../release-artifacts
          # The production profile defaults to remote EAS credentials. Local EAS
          # builds do not consume cloud build credits and must fail rather than
          # generate a replacement upload key if the existing key is unavailable.
          bunx eas-cli@latest env:exec production 'node scripts/validate-production-env.mjs && bunx eas-cli@latest build --platform android --profile production --local --non-interactive'
      - name: Validate signed production AAB
        run: |
          set -euo pipefail
          AAB="$(find ../release-artifacts -type f -name '*.aab' -print -quit)"
          if [ -z "$AAB" ]; then
            echo "::error::EAS local build did not produce an Android App Bundle."
            exit 1
          fi
          cp "$AAB" ../release-artifacts/mamnoon-production.aab
          unzip -t ../release-artifacts/mamnoon-production.aab
          jarsigner -verify -verbose -certs ../release-artifacts/mamnoon-production.aab > ../release-artifacts/aab-signature-verification.txt
          grep -qi "jar verified" ../release-artifacts/aab-signature-verification.txt
          keytool -printcert -jarfile ../release-artifacts/mamnoon-production.aab > ../release-artifacts/aab-signing-certificate.txt
          sha256sum ../release-artifacts/mamnoon-production.aab > ../release-artifacts/mamnoon-production.aab.sha256
          node -e 'const c=require("./app.json"); if(c.expo.android.package!=="com.mamnoon.app") throw new Error("Unexpected Android package name"); console.log("Android package configuration verified:", c.expo.android.package);'
          du -h ../release-artifacts/mamnoon-production.aab
      - name: Upload signed Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: mamnoon-production-aab
          path: |
            release-artifacts/mamnoon-production.aab
            release-artifacts/mamnoon-production.aab.sha256
            release-artifacts/aab-signing-certificate.txt
            release-artifacts/aab-signature-verification.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Build summary
        run: |
          echo "Mamnoon signed production AAB was built locally with the configured EAS upload key." >> "$GITHUB_STEP_SUMMARY"
          echo "The AAB, SHA-256 and signing certificate details are attached as the mamnoon-production-aab artifact." >> "$GITHUB_STEP_SUMMARY"
