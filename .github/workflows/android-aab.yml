name: Android production AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mamnoon Android App Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app
    env:
      APP_ENV: production
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate build credentials and EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub Actions secret EXPO_TOKEN is required."
            exit 1
          fi
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "::error::Add EAS_PROJECT_ID as a GitHub Actions repository variable (not a secret)."
            exit 1
          fi
          if ! printf '%s' "$EAS_PROJECT_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'; then
            echo "::error::EAS_PROJECT_ID must be a valid Expo project UUID."
            exit 1
          fi
      - name: Validate production EAS environment variables
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          bunx eas-cli@latest env:exec production -- node -e '
            const required = [
              "EXPO_PUBLIC_SUPABASE_URL",
              "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY",
              "EXPO_PUBLIC_GOOGLE_MAPS_API_KEY"
            ];
            const missing = required.filter((name) => !process.env[name]?.trim());
            if (missing.length) {
              console.error("Missing EAS production environment variables: " + missing.join(", "));
              process.exit(1);
            }
            if (!process.env.EXPO_PUBLIC_SUPABASE_URL.startsWith("https://")) {
              console.error("EXPO_PUBLIC_SUPABASE_URL must use HTTPS.");
              process.exit(1);
            }
          '
      - name: Build production AAB with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          bunx eas-cli@latest env:exec production -- bunx eas-cli@latest build --platform android --profile production --non-interactive
