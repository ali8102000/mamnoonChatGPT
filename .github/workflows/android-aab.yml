name: Android production AAB

on:
  push:
    branches: [main]
    paths:
      - "expo-app/**"
      - ".github/workflows/android-aab.yml"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mamnoon-android-aab
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build Mamnoon Android App Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app
    env:
      APP_ENV: production
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Expo Doctor
        run: bunx expo-doctor
      - name: Export Android JavaScript bundle
        run: bunx expo export --platform android
      - name: Check EXPO_TOKEN secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret EXPO_TOKEN."
            exit 1
          fi
      - name: Check EAS_PROJECT_ID repository variable
        if: always()
        run: |
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "::error::Missing GitHub Actions repository variable EAS_PROJECT_ID."
            exit 1
          fi
          if ! printf '%s' "$EAS_PROJECT_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}
      - name: Validate production EAS environment variables
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          bunx eas-cli@latest env:exec --environment production 'node scripts/validate-production-env.mjs'
      - name: Build signed production AAB and wait for completion
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          bunx eas-cli@latest env:exec --environment production 'bunx eas-cli@latest build --platform android --profile production --non-interactive --wait --json > "$RUNNER_TEMP/eas-build.json"'
      - name: Download the finished AAB
        id: download
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID="$(node -e 'const v=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/eas-build.json","utf8")); const b=Array.isArray(v)?v[0]:v; if(!b?.id) process.exit(2); process.stdout.write(b.id)')"
          echo "EAS_BUILD_ID=$BUILD_ID" >> "$GITHUB_OUTPUT"
          bunx eas-cli@latest env:exec --environment production "bunx eas-cli@latest build:download --build-id $BUILD_ID --json > \"$RUNNER_TEMP/eas-download.json\""
          DOWNLOADED_PATH="$(node -e 'const v=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/eas-download.json","utf8")); if(!v?.path) process.exit(2); process.stdout.write(v.path)')"
          test -f "$DOWNLOADED_PATH"
          case "$DOWNLOADED_PATH" in
            *.aab) ;;
            *) echo "::error::EAS artifact is not an Android App Bundle: $DOWNLOADED_PATH"; exit 1 ;;
          esac
          mkdir -p ../release-artifacts
          cp "$DOWNLOADED_PATH" ../release-artifacts/mamnoon-production.aab
          test -s ../release-artifacts/mamnoon-production.aab
      - name: Upload AAB as a GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: mamnoon-production-aab
          path: release-artifacts/mamnoon-production.aab
          if-no-files-found: error
          retention-days: 14
      - name: Build summary
        run: |
          echo "AAB build completed. EAS build ID: ${{ steps.download.outputs.EAS_BUILD_ID }}" >> "$GITHUB_STEP_SUMMARY"
          echo "The signed AAB is attached as the mamnoon-production-aab artifact." >> "$GITHUB_STEP_SUMMARY"
; then
            echo "::error::EAS_PROJECT_ID must be a valid Expo project UUID."
            exit 1
          fi
      - name: Validate production EAS environment variables
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          bunx eas-cli@latest env:exec --environment production 'node scripts/validate-production-env.mjs'
      - name: Build signed production AAB and wait for completion
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          bunx eas-cli@latest env:exec --environment production 'bunx eas-cli@latest build --platform android --profile production --non-interactive --wait --json > "$RUNNER_TEMP/eas-build.json"'
      - name: Download the finished AAB
        id: download
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID="$(node -e 'const v=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/eas-build.json","utf8")); const b=Array.isArray(v)?v[0]:v; if(!b?.id) process.exit(2); process.stdout.write(b.id)')"
          echo "EAS_BUILD_ID=$BUILD_ID" >> "$GITHUB_OUTPUT"
          bunx eas-cli@latest env:exec --environment production "bunx eas-cli@latest build:download --build-id $BUILD_ID --json > \"$RUNNER_TEMP/eas-download.json\""
          DOWNLOADED_PATH="$(node -e 'const v=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/eas-download.json","utf8")); if(!v?.path) process.exit(2); process.stdout.write(v.path)')"
          test -f "$DOWNLOADED_PATH"
          case "$DOWNLOADED_PATH" in
            *.aab) ;;
            *) echo "::error::EAS artifact is not an Android App Bundle: $DOWNLOADED_PATH"; exit 1 ;;
          esac
          mkdir -p ../release-artifacts
          cp "$DOWNLOADED_PATH" ../release-artifacts/mamnoon-production.aab
          test -s ../release-artifacts/mamnoon-production.aab
      - name: Upload AAB as a GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: mamnoon-production-aab
          path: release-artifacts/mamnoon-production.aab
          if-no-files-found: error
          retention-days: 14
      - name: Build summary
        run: |
          echo "AAB build completed. EAS build ID: ${{ steps.download.outputs.EAS_BUILD_ID }}" >> "$GITHUB_STEP_SUMMARY"
          echo "The signed AAB is attached as the mamnoon-production-aab artifact." >> "$GITHUB_STEP_SUMMARY"
