name: Mamnoon web CI

on:
  push:
    branches:
      - main
      - chore/decouple-lovable-backend
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mamnoon-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Inventory remaining backend dependencies
        run: |
          echo "=== Lovable references ==="
          git grep -n -i -E 'lovable|connector-gateway\\.lovable' -- . ':!docs/**' || true
          echo "=== Service-role client references ==="
          git grep -n 'supabaseAdmin' -- . ':!docs/**' || true
          echo "=== Map-place search helper references ==="
          git grep -n 'searchMapPlaceSuggestions' -- . ':!docs/**' || true
          echo "=== TanStack server function declarations ==="
          git grep -n 'createServerFn' -- src || true
          echo "=== Vercel-only map helper references ==="
          git grep -n 'map-place-search.server' -- src || true
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run TypeScript compiler
        run: bun run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run ESLint
        run: bun run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run test suite
        run: bun run test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build production application
        run: bun run build
