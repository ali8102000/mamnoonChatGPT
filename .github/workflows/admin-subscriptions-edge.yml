name: Mamnoon Supabase Edge Function checks

on:
  pull_request:
    paths:
      - "supabase/functions/admin-subscriptions/**"
      - "supabase/functions/admin-users/**"
      - "supabase/functions/admin-finance/**"
      - "supabase/functions/admin-governance/**"
      - "supabase/functions/maps-proxy/**"
      - "supabase/functions/increment-request-count/**"
      - "supabase/functions/bootstrap-admin/**"
      - "supabase/functions/friends-proxy/**"
      - "supabase/functions/auth-proxy/**"
      - "supabase/functions/reputation-proxy/**"
      - "supabase/functions/import-assist/**"
      - ".github/workflows/admin-subscriptions-edge.yml"
  push:
    paths:
      - "supabase/functions/admin-subscriptions/**"
      - "supabase/functions/admin-users/**"
      - "supabase/functions/admin-finance/**"
      - "supabase/functions/admin-governance/**"
      - "supabase/functions/maps-proxy/**"
      - "supabase/functions/increment-request-count/**"
      - "supabase/functions/bootstrap-admin/**"
      - "supabase/functions/friends-proxy/**"
      - "supabase/functions/auth-proxy/**"
      - "supabase/functions/reputation-proxy/**"
      - "supabase/functions/import-assist/**"
      - ".github/workflows/admin-subscriptions-edge.yml"

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions in isolated Deno workspace
        run: |
          # Keep Deno outside the web app's package.json dependency tree.
          mkdir -p /tmp/mamnoon-supabase
          cp -R supabase/. /tmp/mamnoon-supabase/
          cd /tmp/mamnoon-supabase
          for file in functions/*/index.ts; do
            echo "Checking $file"
            deno check --node-modules-dir=none "$file"
          done
