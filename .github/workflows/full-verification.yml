name: Mamnoon full verification

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mamnoon-full-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck, tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build

  edge-functions:
    name: Supabase Edge Function typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions in isolated Deno workspace
        run: |
          # Keep Deno outside the web app's package.json dependency tree.
          mkdir -p /tmp/mamnoon-supabase
          cp -R supabase/. /tmp/mamnoon-supabase/
          cd /tmp/mamnoon-supabase
          for file in functions/*/index.ts; do
            echo "Checking $file"
            deno check --node-modules-dir=none "$file"
          done
  expo:
    name: Expo Android TypeScript verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: yarn
          cache-dependency-path: expo-app/yarn.lock
      - name: Verify Node.js runtime
        run: node --version
      - name: Install locked Expo dependencies
        run: yarn install --frozen-lockfile
      - name: Type-check Android app
        run: yarn tsc --noEmit

  auth-trigger-migration:
    name: Auth profile trigger migration integration test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mamnoon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mamnoon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create minimal Auth and profile schema
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mamnoon_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon;
          CREATE ROLE authenticated;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            email text,
            phone text,
            raw_user_meta_data jsonb
          );
          CREATE TABLE public.profiles (
            id uuid PRIMARY KEY,
            phone text NOT NULL UNIQUE,
            full_name text NOT NULL,
            email text
          );
          CREATE TABLE public.user_roles (
            user_id uuid NOT NULL,
            role text NOT NULL,
            UNIQUE (user_id, role)
          );
          SQL
      - name: Apply auth profile trigger migration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mamnoon_test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261117210000_auth_profile_trigger_fail_closed.sql
      - name: Test phone normalization, duplicates, optional email and fallback accounts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mamnoon_test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/auth_profile_trigger_migration.sql


  supabase-migration-syntax:
    name: Parse Supabase migration SQL without an incomplete baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PostgreSQL SQL parser
        run: python -m pip install --disable-pip-version-check pglast
      - name: Parse every Supabase migration
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          files = sorted(Path("supabase/migrations").glob("*.sql"))
          if not files:
              raise SystemExit("No Supabase migration files found")

          failed = []
          for path in files:
              try:
                  parse_sql(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  failed.append((path, exc))

          for path, exc in failed:
              print(f"SQL parse failed: {path}: {exc}")

          print(f"Parsed {len(files) - len(failed)} of {len(files)} migration files")
          if failed:
              raise SystemExit(1)
          PY
